# This repo's own housekeeping CI (lints npm-ci.yml/npm-publish.yml below). Not exported,
# not something a consuming repo should reference. The reusable workflows other repos
# actually call are npm-ci.yml and npm-publish.yml, per the table in README.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: actionlint
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
        shell: bash

      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: scripts
