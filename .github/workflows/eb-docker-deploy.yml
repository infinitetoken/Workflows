# Exported/reusable — consuming repos call this via
# uses: infinitetoken/Workflows/.github/workflows/eb-docker-deploy.yml@v1
# See examples/eb-docker-deploy.yml for a copy-pasteable caller.
name: eb-docker-deploy

on:
  workflow_call:
    inputs:
      app-name:
        description: App name — used for the ECR repo, EB application/environment, and default S3 key prefix
        type: string
        required: true
      node-version:
        description: Node.js version to use
        type: string
        default: '20'
      verify-script:
        description: npm script to run before deploy (forwarded to npm-ci.yml as `script`)
        type: string
        default: 'verify'
      aws-region:
        description: AWS region
        type: string
        default: 'us-east-1'
      eb-environment:
        description: Elastic Beanstalk environment name. Defaults to `<app-name>-prod`
        type: string
        default: ''
      s3-bucket:
        description: S3 bucket for the deployment bundle. Defaults to the EB-managed bucket for this account/region
        type: string
        default: ''
      s3-key-prefix:
        description: Key prefix within the S3 bucket for the deployment bundle. Defaults to `app-name`
        type: string
        default: ''
      include-platform-dir:
        description: Whether to copy a .platform directory into the deployment bundle
        type: boolean
        default: true
      pre-deploy-command:
        description: Optional npm script to run before building/pushing the image (e.g. db migrations). Leave empty to skip
        type: string
        default: ''
    secrets:
      aws-role-to-assume:
        description: IAM role ARN assumed via OIDC to build/push the image and deploy
        required: true
      database-url:
        description: Only needed when pre-deploy-command reads it (e.g. a migration script)
        required: false

jobs:
  build-test:
    uses: ./.github/workflows/npm-ci.yml
    with:
      node-version: ${{ inputs.node-version }}
      script: ${{ inputs.verify-script }}

  build-and-deploy:
    needs: build-test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ inputs.aws-region }}
      ECR_REPOSITORY: ${{ inputs.app-name }}
      EB_APPLICATION: ${{ inputs.app-name }}
      EB_ENVIRONMENT: ${{ inputs.eb-environment != '' && inputs.eb-environment || format('{0}-prod', inputs.app-name) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        if: inputs.pre-deploy-command != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        if: inputs.pre-deploy-command != ''
        run: npm ci

      - name: Run pre-deploy command
        if: inputs.pre-deploy-command != ''
        env:
          DATABASE_URL: ${{ secrets.database-url }}
        run: npm run ${{ inputs.pre-deploy-command }}

      - name: Configure AWS credentials
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws-role-to-assume }}
          aws-region: ${{ env.AWS_REGION }}
          output-credentials: true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE_URI" .
          docker tag "$IMAGE_URI" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$IMAGE_URI"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Create Elastic Beanstalk deployment bundle
        env:
          INCLUDE_PLATFORM_DIR: ${{ inputs.include-platform-dir }}
        run: |
          sed "s|<ECR_IMAGE_URL>|$IMAGE_URI|g" docker-compose.yml > docker-compose.generated.yml
          mkdir -p bundle
          cp docker-compose.generated.yml bundle/docker-compose.yml
          cp -r .ebextensions bundle/.ebextensions
          if [ "${INCLUDE_PLATFORM_DIR}" = "true" ]; then
            cp -r .platform bundle/.platform
          fi
          (cd bundle && zip -r ../deploy.zip .)

      - name: Deploy to Elastic Beanstalk
        env:
          VERSION_LABEL: ${{ inputs.app-name }}-${{ github.sha }}-${{ github.run_number }}
          S3_BUCKET_OVERRIDE: ${{ inputs.s3-bucket }}
          S3_KEY_PREFIX: ${{ inputs.s3-key-prefix != '' && inputs.s3-key-prefix || inputs.app-name }}
        run: |
          set -euo pipefail

          S3_BUCKET="${S3_BUCKET_OVERRIDE}"
          if [ -z "${S3_BUCKET}" ]; then
            AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
            S3_BUCKET="elasticbeanstalk-${AWS_REGION}-${AWS_ACCOUNT_ID}"
          fi
          S3_KEY="${S3_KEY_PREFIX}/${VERSION_LABEL}.zip"

          echo "Uploading deployment bundle to s3://${S3_BUCKET}/${S3_KEY}"
          aws s3 cp deploy.zip "s3://${S3_BUCKET}/${S3_KEY}"

          echo "Creating application version ${VERSION_LABEL}"
          aws elasticbeanstalk create-application-version \
            --application-name "${EB_APPLICATION}" \
            --version-label "${VERSION_LABEL}" \
            --source-bundle S3Bucket="${S3_BUCKET}",S3Key="${S3_KEY}" \
            --process

          echo "Checking environment status"
          ENV_STATUS="$(aws elasticbeanstalk describe-environments \
            --environment-names "${EB_ENVIRONMENT}" \
            --query 'Environments[0].Status' \
            --output text 2>/dev/null || true)"

          if [ -z "${ENV_STATUS}" ] || [ "${ENV_STATUS}" = "None" ] || [ "${ENV_STATUS}" = "Terminated" ]; then
            echo "Environment does not exist — creating ${EB_ENVIRONMENT}"
            SOLUTION_STACK="64bit Amazon Linux 2023 v4.12.3 running Docker"
            echo "Using solution stack: ${SOLUTION_STACK}"
            aws elasticbeanstalk create-environment \
              --application-name "${EB_APPLICATION}" \
              --environment-name "${EB_ENVIRONMENT}" \
              --solution-stack-name "${SOLUTION_STACK}" \
              --version-label "${VERSION_LABEL}"
          elif [ "${ENV_STATUS}" = "Ready" ]; then
            echo "Updating environment ${EB_ENVIRONMENT}"
            aws elasticbeanstalk update-environment \
              --environment-name "${EB_ENVIRONMENT}" \
              --version-label "${VERSION_LABEL}"
          else
            echo "Environment is in '${ENV_STATUS}' state — fix it manually and retry."
            exit 1
          fi

          echo "Deployment triggered"

      - name: Wait for Green Health
        run: |
          MAX_RETRIES=8
          RETRY_INTERVAL=300
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Health check attempt $i/$MAX_RETRIES..."
            HEALTH=$(aws elasticbeanstalk describe-environments \
              --application-name "${EB_APPLICATION}" \
              --environment-names "${EB_ENVIRONMENT}" \
              --region "${AWS_REGION}" \
              --query "Environments[0].Health" \
              --output text)
            STATUS=$(aws elasticbeanstalk describe-environments \
              --application-name "${EB_APPLICATION}" \
              --environment-names "${EB_ENVIRONMENT}" \
              --region "${AWS_REGION}" \
              --query "Environments[0].Status" \
              --output text)
            echo "  Status=$STATUS  Health=$HEALTH"
            if [ "$HEALTH" = "Green" ] && [ "$STATUS" = "Ready" ]; then
              echo "Deployment succeeded."
              break
            fi
            if [ "$STATUS" = "Terminated" ] || [ "$STATUS" = "Terminating" ]; then
              echo "Environment terminated unexpectedly. Aborting."
              exit 1
            fi
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "Timed out waiting for Green health."
              exit 1
            fi
            sleep $RETRY_INTERVAL
          done

      - name: Print Recent EB Events
        if: always()
        run: |
          aws elasticbeanstalk describe-events \
            --application-name "${EB_APPLICATION}" \
            --environment-name "${EB_ENVIRONMENT}" \
            --region "${AWS_REGION}" \
            --max-records 20 \
            --query "Events[*].[EventDate,Severity,Message]" \
            --output table
