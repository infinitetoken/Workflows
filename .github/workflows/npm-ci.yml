# Exported/reusable — consuming repos call this via
# uses: infinitetoken/Workflows/.github/workflows/npm-ci.yml@v1
# See examples/npm-ci.yml for a copy-pasteable caller.
name: npm-ci

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to use
        type: string
        default: '22'
      script:
        description: npm script to run after install
        type: string
        default: 'verify'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run ${{ inputs.script }}
