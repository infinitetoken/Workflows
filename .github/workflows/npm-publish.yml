# Exported/reusable — consuming repos call this via
# uses: infinitetoken/Workflows/.github/workflows/npm-publish.yml@v1
# See examples/npm-publish.yml for a copy-pasteable caller.
name: npm-publish

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to use
        type: string
        default: '24'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm publish
