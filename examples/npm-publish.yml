# For repos that publish an actual npm package to the registry (e.g. @rific/*, @tastic/*).
# Not for every repo that merely uses npm: server apps, Expo apps, and CLI tools that
# aren't published all need npm-ci.yml only, not this.
#
# Copy into a consuming repo as .github/workflows/publish.yml.
# Update the @vX.Y.Z tag to the latest release: https://github.com/infinitetoken/Workflows/tags
name: Publish
run-name: Publish ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    uses: infinitetoken/Workflows/.github/workflows/npm-publish.yml@v1
    permissions:
      contents: read
      id-token: write
